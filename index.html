<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link href="style.css" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <div class="social-card">
    <img src="./assets/images/photo_2026-09-10_17-43-20.jpg" alt="Ehinomen Osaigbovo" class="social-card__image">

    <div class="social-card__texts">
      <h1 class="social-card__name">Ehinomen Osaigbovo</h1>
      <p class="social-card__location">Lagos, Nigeria</p>
    </div>

    <div class="social-card__bio">
      <p class="social-card__bio-text">"Front-end developer and avid reader."</p>
    </div>

    <div class="social-card__links-wrapper">
         <ul class="social-card__list">
          <li class="social-card__item">
            <a href="https://github.com/Ehicodes" class="social-card__link">GitHub</a>
          </li>
          <li class="social-card__item">
            <a href="https://www.frontendmentor.io/profile/Ehicodes" class="social-card__link">Frontend Mentor</a>
          </li>
          <li class="social-card__item">
            <a href="https://www.linkedin.com/in/ehinomen-osaigbovo/" class="social-card__link">LinkedIn</a>
          </li>
          <li class="social-card__item">
            <a href="https://x.com/ehinomen_01?s=11" class="social-card__link">Twitter</a>
          </li>
          <li class="social-card__item">
            <a href="https://www.instagram.com/ehicodes/" class="social-card__link">Instagram</a>
          </li>
         </ul>
    </div>
  </div>
  
  <!--footer-->
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ehinomen Osaigbovo</a>.
  </footer>
</body>
</html>
